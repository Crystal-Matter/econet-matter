services:
  econet-matter:
    build: .
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 1m
    user: "${MATTER_UID:-1000}:${MATTER_GID:-1000}"
    environment:
      ECONET_EMAIL:
      ECONET_PASSWORD:
      ECONET_SERIAL_NUMBER:
      ECONET_POWER_FILE:
      MATTER_PORT: "${MATTER_PORT:-5540}"
      TZ: "${TZ:-UTC}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - type: bind
        source: ./matter-data
        target: /data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
